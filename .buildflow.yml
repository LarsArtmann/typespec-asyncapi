# Formatting has exactly one owner: treefmt/prettier, enforced by the
# nix-flake-check step (treefmt-check runs in every `nix flake check`) with
# excludes for generated/archived files (see flake.nix). These providers
# duplicate that responsibility WITHOUT those excludes and disagree with it
# (oxfmt: ~135 findings; prettier-format flags Tailwind-generated
# website/src/styles/global.out.css; dprint-format rewrote
# website/IMPROVEMENTS.md in dprint table style on 2026-11-04 and broke the
# format check) — advisory-only noise, so all stay skipped: one formatter
# owner, no split brain.
skip_steps:
  - oxfmt
  - prettier-format
  - dprint-format
  # pnpm-update bumps manifests WITHOUT regenerating pnpm-lock.yaml (3x:
  # 2026-10-03, 2026-11-03 daemon commits, 2026-11-04) and re-drifts
  # typescript to 7.0.2, which `astro check` refuses. Dependency updates are
  # deliberate, verified passes instead (see TODO_LIST 2026-11-04 section);
  # upstream candidate: teach pnpm-update lockfile atomicity.
  - pnpm-update
