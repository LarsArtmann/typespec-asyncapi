# Formatting has exactly one owner: treefmt/prettier, enforced by the
# nix-flake-check step (treefmt-check runs in every `nix flake check`) with
# excludes for generated/archived files (see flake.nix). These providers
# duplicate that responsibility WITHOUT those excludes and disagree with it
# (~135 oxfmt findings; prettier-format flags Tailwind-generated
# website/src/styles/global.out.css) — advisory-only noise, so both stay
# skipped: one formatter owner, no split brain.
skip_steps:
  - oxfmt
  - prettier-format
