asyncapi: 3.1.0
info:
  title: Generated API
  version: 1.0.0
channels:
  animals:
    address: animals
    messages:
      Dog:
        $ref: "#/components/messages/Dog"
      Cat:
        $ref: "#/components/messages/Cat"
operations:
  publish:
    action: send
    channel:
      $ref: "#/channels/animals"
    messages:
      - $ref: "#/channels/animals/messages/Dog"
      - $ref: "#/channels/animals/messages/Cat"
components:
  messages:
    Dog:
      name: Dog
      contentType: application/json
      title: Dog
      payload:
        $ref: "#/components/schemas/Dog"
    Cat:
      name: Cat
      contentType: application/json
      title: Cat
      payload:
        $ref: "#/components/schemas/Cat"
  schemas:
    Animal:
      type: object
      properties:
        type:
          type: string
        name:
          type: string
      required:
        - type
        - name
      discriminator: type
    Dog:
      type: object
      properties:
        type:
          const: dog
        breed:
          type: string
      required:
        - type
        - breed
      allOf:
        - $ref: "#/components/schemas/Animal"
    Cat:
      type: object
      properties:
        type:
          const: cat
        indoor:
          type: boolean
      required:
        - type
        - indoor
      allOf:
        - $ref: "#/components/schemas/Animal"
