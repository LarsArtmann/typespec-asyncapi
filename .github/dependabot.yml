version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # minimatch GHSA-g3hv-75wg-m249: the >= 7 chains are patched via the
      # "minimatch@^10": "^11.0.9" override in pnpm-workspace.yaml (11.x is
      # dual-mode CJS), but spectral-core still pins 3.x and Dependabot keeps
      # proposing un-mergeable bumps for it; it fails daily since 2026-11-19.
      # Revisit when spectral-core drops its minimatch dependency.
      - dependency-name: "minimatch"
  - package-ecosystem: npm
    directory: /website/video
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
