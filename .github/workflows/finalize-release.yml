# Finalize an approved npm release: verify the version is live on the
# registry, fetch the exact tarball npm published, and create the GitHub
# release from the tagged CHANGELOG section.
#
# Why this is a separate workflow: npm staged publishing requires a human
# 2FA approval between staging (release.yml) and public availability, and
# that approval cannot happen inside GitHub Actions. Trigger this after
# approving the staged version on npmjs.com:
#
#   gh workflow run finalize-release.yml -f version=1.3.0
#
# Idempotent: an existing GitHub release for the tag is left untouched.

name: Finalize release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Approved version to finalize, e.g. 1.3.0 (no leading v)"
        type: string
        required: true

permissions: {}

jobs:
  finalize:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release for the existing tag

    steps:
      - name: Validate version input
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::version must be plain semver without a leading v: got '$VERSION'"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ inputs.version }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Verify the version is live on npm
        env:
          VERSION: ${{ inputs.version }}
        run: |
          LIVE=$(npm view "@lars-artmann/typespec-asyncapi@$VERSION" version 2>/dev/null || true)
          if [ "$LIVE" != "$VERSION" ]; then
            echo "::error::@lars-artmann/typespec-asyncapi@$VERSION is not published yet (registry says '${LIVE:-nothing}'). Approve the staged version on npmjs.com first."
            exit 1
          fi

      - name: Download the published tarball
        env:
          VERSION: ${{ inputs.version }}
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          npm pack "@lars-artmann/typespec-asyncapi@$VERSION" --pack-destination "$RUNNER_TEMP/release"

      # Body comes from the tagged version's CHANGELOG.md section, so the
      # changelog stays the single source of release notes.
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; nothing to do"
            exit 0
          fi
          NOTES=$(node -e '
            const fs = require("fs");
            const version = process.argv[1];
            const section = fs.readFileSync("CHANGELOG.md", "utf8")
              .split(/^## /m)
              .find((s) => s.startsWith("[" + version + "]"));
            if (section === undefined) {
              throw new Error("No CHANGELOG.md section for " + version);
            }
            console.log(section.slice(section.indexOf("\n") + 1).trimEnd());
          ' "$VERSION")
          gh release create "$TAG" "$RUNNER_TEMP/release/"*.tgz --verify-tag --title "$TAG" --notes "$NOTES" --latest
