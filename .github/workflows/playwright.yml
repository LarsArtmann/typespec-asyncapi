# Playwright smoke tests for the built website (Chromium on the runner).
# Local NixOS shells cannot launch the bundled Chromium (no nix-ld), so the
# runner is the verification surface by design.

name: Playwright

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "website/src/**"
      - "website/tests/**"
      - "website/playwright.config.ts"
      - ".github/workflows/playwright.yml"

permissions:
  contents: read

concurrency:
  group: playwright-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: latest

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build emitter (website build resolves dist/)
        run: pnpm run build

      - name: Build website
        run: pnpm --filter typespec-asyncapi-website run build

      - name: Run Playwright smoke tests
        run: pnpm --filter typespec-asyncapi-website exec playwright install chromium --with-deps && pnpm --filter typespec-asyncapi-website run test:e2e
