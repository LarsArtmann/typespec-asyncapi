name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm run test

      - name: Coverage gate
        run: pnpm run test:coverage:gate

      - name: Duplication gate
        run: pnpm run duplicate

      - name: Compile examples
        run: |
          for dir in examples/*/; do
            dir=${dir%/}
            for f in "$dir"/*.tsp; do
              [ -f "$f" ] || continue
              echo "Compiling $f..."
              (cd "$dir" && pnpm exec tsp compile "$(basename "$f")")
            done
          done
