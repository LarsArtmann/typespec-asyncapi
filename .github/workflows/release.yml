# Release workflow: tag-triggered npm publish, gated on the full verify suite.
#
# Setup: register release.yml as a trusted publisher in the npm package
# settings and allow direct npm publish.
# https://docs.npmjs.com/trusted-publishers/#for-github-actions
#
# npm uses GitHub OIDC for trusted publishing and provenance.
#
# Dry-run: trigger manually via workflow_dispatch with dry_run=true to
# exercise the whole pipeline (install, verify, publish dry-run) without
# uploading a package. A `v*` tag or a manual run with dry_run=false publishes.

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run publish as a dry-run (no registry write)"
        type: boolean
        default: true

permissions: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read # check out the source for verification
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: latest

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - run: pnpm install --frozen-lockfile

      - name: Verify (build + lint + test + coverage + duplication)
        run: pnpm run verify

      - name: Pack verified npm package
        run: pnpm pack --out "$RUNNER_TEMP/package.tgz"

      - name: Dry-run npm publish
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: npm publish "$RUNNER_TEMP/package.tgz" --dry-run --ignore-scripts --access public --tag latest

      - name: Upload verified npm package
        if: github.event_name == 'push' || !inputs.dry_run
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-package-${{ github.run_attempt }}
          path: ${{ runner.temp }}/package.tgz
          if-no-files-found: error

  publish:
    needs: verify
    if: github.event_name == 'push' || !inputs.dry_run
    runs-on: ubuntu-latest
    permissions:
      id-token: write # exchange the GitHub OIDC token for npm publish credentials

    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.verify.outputs.artifact-id }}
          path: ${{ runner.temp }}/npm-package

      - name: Publish to npm
        shell: bash
        run: |
          PACKAGE="$RUNNER_TEMP/npm-package/package.tgz"
          VERSION=$(tar -xOzf "$PACKAGE" package/package.json | node -pe 'JSON.parse(require("node:fs").readFileSync(0, "utf8")).version')
          TAG_ARGS=()
          # npm 11 requires explicitly opting in to publishing prereleases to latest.
          if [[ "$VERSION" == *-* ]]; then
            TAG_ARGS=(--tag latest)
          fi
          npm publish "$PACKAGE" --registry https://registry.npmjs.org/ --provenance --ignore-scripts --access public "${TAG_ARGS[@]}"

  github-release:
    needs: publish
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release for the existing tag

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Body comes from the tagged version's CHANGELOG.md section, so the
      # changelog stays the single source of release notes. Idempotent: a
      # re-run of the workflow for an existing release skips this step.
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$GITHUB_REF_NAME"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; skipping creation"
            exit 0
          fi
          VERSION="${TAG#v}"
          NOTES=$(node -e '
            const fs = require("fs");
            const version = process.argv[1];
            const section = fs.readFileSync("CHANGELOG.md", "utf8")
              .split(/^## /m)
              .find((s) => s.startsWith(`[${version}]`));
            if (section === undefined) {
              throw new Error(`No CHANGELOG.md section for ${version}`);
            }
            console.log(section.slice(section.indexOf("\n") + 1).trimEnd());
          ' "$VERSION")
          gh release create "$TAG" --verify-tag --title "$TAG" --notes "$NOTES" --latest
