# Release workflow: tag-triggered STAGE publish, gated on the full verify suite.
#
# npm's intended maximum-security model for trusted publishing: CI stages
# the package over GitHub OIDC (`npm stage publish`), a maintainer then
# approves it with 2FA on npmjs.com, and only after that does the version
# become public. Approval is deliberately impossible from CI (an OIDC
# identity cannot perform a human second factor), so the GitHub release
# is created afterwards by finalize-release.yml.
# https://docs.npmjs.com/staged-publishing
# https://docs.npmjs.com/trusted-publishers/#for-github-actions
#
# The trusted-publisher card must grant `npm stage publish` (always on)
# and does NOT need to grant direct `npm publish` or dist-tag management.
#
# Dry-run: trigger manually via workflow_dispatch with dry_run=true to
# exercise the whole pipeline (install, verify, staged publish dry-run)
# without uploading. A `v*` tag or a manual run with dry_run=false stages
# the package; then approve it on npmjs.com and dispatch
# finalize-release.yml with the version.

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run the staged publish as a dry-run (no registry write)"
        type: boolean
        default: true

permissions: {}

# One release pipeline at a time per ref; never cancel mid-publish (a killed
# publish step is how half-shipped releases happen).
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read # check out the source for verification
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: latest

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - run: pnpm install --frozen-lockfile

      - name: Verify (build + lint + test + coverage + duplication)
        run: pnpm run verify

      - name: Pack verified npm package
        run: pnpm pack --out "$RUNNER_TEMP/package.tgz"

      - name: Dry-run staged npm publish
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: npm stage publish "$RUNNER_TEMP/package.tgz" --dry-run --ignore-scripts --access public --tag latest

      - name: Upload verified npm package
        if: github.event_name == 'push' || !inputs.dry_run
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-package-${{ github.run_attempt }}
          path: ${{ runner.temp }}/package.tgz
          if-no-files-found: error

  stage:
    needs: verify
    if: github.event_name == 'push' || !inputs.dry_run
    runs-on: ubuntu-latest
    permissions:
      id-token: write # exchange the GitHub OIDC token for npm stage-publish credentials

    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.verify.outputs.artifact-id }}
          path: ${{ runner.temp }}/npm-package

      - name: Stage package on npm
        shell: bash
        run: |
          PACKAGE="$RUNNER_TEMP/npm-package/package.tgz"
          VERSION=$(tar -xOzf "$PACKAGE" package/package.json | node -pe 'JSON.parse(require("node:fs").readFileSync(0, "utf8")).version')
          TAG_ARGS=()
          # npm 11 requires explicitly opting in to publishing prereleases to latest.
          if [[ "$VERSION" == *-* ]]; then
            TAG_ARGS=(--tag latest)
          fi
          npm stage publish "$PACKAGE" --registry https://registry.npmjs.org/ --provenance --ignore-scripts --access public "${TAG_ARGS[@]}"
          {
            echo "### Staged @lars-artmann/typespec-asyncapi@$VERSION"
            echo ""
            echo "Approve it with 2FA on npmjs.com, then create the GitHub release:"
            echo ""
            echo "\`gh workflow run finalize-release.yml -f version=$VERSION\`"
          } >> "$GITHUB_STEP_SUMMARY"
