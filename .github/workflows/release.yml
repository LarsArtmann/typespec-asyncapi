# Release workflow: tag-triggered npm publish, gated on the full verify suite.
#
# Setup: register release.yml as a trusted publisher in the npm package
# settings and allow direct npm publish.
# https://docs.npmjs.com/trusted-publishers/#for-github-actions
#
# npm uses GitHub OIDC for trusted publishing and provenance.
#
# Dry-run: trigger manually via workflow_dispatch with dry_run=true to
# exercise the whole pipeline (install, verify, publish dry-run) without
# uploading a package. A `v*` tag or a manual run with dry_run=false publishes.

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run publish as a dry-run (no registry write)"
        type: boolean
        default: true

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # creating GitHub Releases on tag push
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: latest

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: pnpm

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - run: pnpm install --frozen-lockfile

      - name: Verify (build + lint + test + coverage + duplication)
        run: pnpm run verify

      - name: Publish to npm
        run: |
          # npm >= 11 refuses to put a prerelease on the default `latest` tag;
          # this project's convention is that `latest` tracks the newest beta
          # (all published versions so far are prereleases), so opt in
          # explicitly whenever the version has a prerelease suffix.
          VERSION=$(node -p "require('./package.json').version")
          if [[ "$VERSION" == *-* ]]; then
            TAG_ARGS=(--tag latest)
          else
            TAG_ARGS=()
          fi
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            if [[ "${{ inputs.dry_run }}" == "true" ]]; then
              echo "Dry-run requested: npm publish --dry-run (no registry write)"
              npm publish --dry-run --ignore-scripts --access public "${TAG_ARGS[@]}"
            else
              echo "Manual dispatch with dry_run=false"
              npm publish --provenance --ignore-scripts --access public "${TAG_ARGS[@]}"
            fi
          else
            echo "Tag push: publishing with provenance"
            npm publish --provenance --ignore-scripts --access public "${TAG_ARGS[@]}"
          fi

      # Body comes from the tagged version's CHANGELOG.md section, so the
      # changelog stays the single source of release notes. Idempotent: a
      # re-run of the workflow for an existing release skips this step.
      - name: Create GitHub release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$GITHUB_REF_NAME"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; skipping creation"
            exit 0
          fi
          VERSION="${TAG#v}"
          NOTES=$(node -e '
            const fs = require("fs");
            const version = process.argv[1];
            const section = fs.readFileSync("CHANGELOG.md", "utf8")
              .split(/^## /m)
              .find((s) => s.startsWith(`[${version}]`));
            if (section === undefined) {
              throw new Error(`No CHANGELOG.md section for ${version}`);
            }
            console.log(section.slice(section.indexOf("\n") + 1).trimEnd());
          ' "$VERSION")
          gh release create "$TAG" --title "$TAG" --notes "$NOTES" --latest
