# Release workflow: tag-triggered npm publish, gated on the full verify suite.
#
# Setup (one-time, already done):
#   Repository Settings > Secrets and variables > Actions > NPM_TOKEN
#   must contain an npm access token with publish rights to the
#   @lars-artmann scope (granular token recommended).
#
# Provenance: publishing with --provenance requires the `id-token: write`
# permission below; npm generates a signed provenance attestation from
# GitHub's OIDC provider, visible on the npm package page.
#
# Dry-run: trigger manually via workflow_dispatch with dry_run=true to
# exercise the whole pipeline (install, verify, publish dry-run) without
# touching the registry. Real publishes happen only on `v*` tags.

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run publish as a dry-run (no registry write)"
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: latest

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - run: pnpm install --frozen-lockfile

      - name: Verify (build + lint + test + coverage + duplication)
        run: pnpm run verify

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          printf 'registry=https://registry.npmjs.org/\n//registry.npmjs.org/:_authToken=%s\n' "$NODE_AUTH_TOKEN" > "$HOME/.npmrc"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            if [[ "${{ inputs.dry_run }}" == "true" ]]; then
              echo "Dry-run requested: npm publish --dry-run (no registry write)"
              npm publish --dry-run --ignore-scripts --access public
            else
              echo "Manual dispatch with dry_run=false"
              npm publish --provenance --ignore-scripts --access public
            fi
          else
            echo "Tag push: publishing with provenance"
            npm publish --provenance --ignore-scripts --access public
          fi
