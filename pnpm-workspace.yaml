packages:
  - "examples/*"
  - "website"

overrides:
  fast-uri: ^3.1.9
  js-yaml: ^4.3.2
  "nanoid@<3.3.18": "3.3.18"
  "devalue@<=5.9.2": "^5.9.3"
  "brace-expansion@^1": "^1.1.21"
  "brace-expansion@^5": "^5.0.12"
  "postcss-selector-parser@<7.1.6": "7.1.6"
  # undici 7 and 8 coexist (via @scalar/json-magic old/new); only 7.x is vulnerable
  "undici@^7": "^7.30.1"

auditConfig:
  ignoreGhsas:
    # minimatch <11.0.1 glob-DoS (dev-only consumers: spectral-core via
    # @asyncapi/parser, eslint config chain). The patched version is ESM-only
    # while spectral-core is CJS and calls require("minimatch")(...) directly,
    # so a forced bump breaks the parser tests; patterns come from our own
    # tool config, never attacker input. Re-evaluate when spectral upgrades.
    - GHSA-g3hv-75wg-m249

allowBuilds:
  "@scarf/scarf": false
  esbuild: true
  sharp: true
