  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    tl.fromTo(
      "#01-drift-a",
      { scale: 1.5, filter: "blur(16px)", opacity: 0 },
      { scale: 1, filter: "blur(0px)", opacity: 1, duration: 0.5, ease: "power4.out" },
      0.15
    );

    tl.set("#01-drift-a", { autoAlpha: 0 }, 1.35);
    tl.fromTo(
      "#01-drift-b",
      { x: -300, opacity: 0 },
      { x: 0, opacity: 1, duration: 0.45, ease: "expo.out" },
      1.35
    );

    tl.fromTo(
      "#01-drift-punch",
      { y: 90, rotation: 5, opacity: 0 },
      { y: 0, rotation: 0, opacity: 1, duration: 0.55, ease: "circ.out" },
      2.55
    );
    tl.fromTo(
      "#01-drift-rule",
      { scaleX: 0, opacity: 0 },
      { scaleX: 1, opacity: 1, duration: 0.5, ease: "power3.out" },
      3.15
    );

    const jitter = { p: 0 };
    tl.to(
      jitter,
      {
        p: Math.PI * 2 * 2,
        duration: 1.4,
        ease: "none",
        onUpdate: function () {
          const el = document.getElementById("01-drift-jitter");
          if (el) {
            el.style.transform =
              "translateY(" + (Math.sin(jitter.p) * 3).toFixed(2) + "px)";
          }
        },
      },
      3.6
    );

    window.__timelines["01-drift"] = tl;
  </script>
